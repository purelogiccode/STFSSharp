name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Build.props
            global.json

      - name: Restore
        run: dotnet restore StfsSharp.sln

      - name: Build
        run: dotnet build StfsSharp.sln --no-restore --configuration Release

      - name: Verify formatting
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format whitespace StfsSharp.sln --verify-no-changes --no-restore

      - name: Test
        run: dotnet test StfsSharp.Tests/StfsSharp.Tests.csproj --no-build --configuration Release

  fuzz-smoke:
    name: fuzz-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Build.props
            global.json

      - name: Restore
        run: dotnet restore StfsSharp.Fuzz/StfsSharp.Fuzz.csproj

      - name: Fuzz for 60 seconds
        run: dotnet run --project StfsSharp.Fuzz/StfsSharp.Fuzz.csproj -c Release -- --seconds 60

  pack:
    name: pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-and-test, fuzz-smoke]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Build.props
            global.json

      - name: Restore
        run: dotnet restore StfsSharp.sln

      - name: Build
        run: dotnet build StfsSharp.sln --no-restore --configuration Release

      - name: Pack
        run: dotnet pack StfsSharp/StfsSharp.csproj --no-build --configuration Release --output ./artifacts

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
          if-no-files-found: error

  publish:
    name: publish to NuGet
    runs-on: ubuntu-latest
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    environment: nuget
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download NuGet artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts

      - name: Push to NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push ./artifacts/*.snupkg --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
